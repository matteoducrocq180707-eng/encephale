<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f3eef4" media="(prefers-color-scheme: light)">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}.statusbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:35}</style>
<title>Encéphale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: a rail of brain regions (tab bar on phones) beside one working column.
   Each region owns one fluorescent hue; the home view is a live sagittal neural map.
   Dark = fluorescence microscopy (Brainbow). Light = a stained histology slide. */
:root{
  --bg:#06080f;
  --bg-1:#0a0e1a;
  --bg-2:#0f1424;
  --bg-3:#171e35;
  --line:rgba(146,164,255,.13);
  --line-2:rgba(146,164,255,.26);
  --fg:#e8ebf7;
  --fg-2:#a6aecb;
  --fg-3:#6e7696;
  --ink-inv:#06080f;
  --scrim:rgba(2,3,9,.62);
  --r-thal:#52d6ff;
  --r-pfc:#ff5cbe;
  --r-hip:#ffb648;
  --r-net:#a585ff;
  --r-cb:#3fe0a5;
  --r-sleep:#7d93ff;
  --r-stem:#ff7c5c;
  --r-temp:#ffe066;
  --r-sys:#b4bdd9;
  --spark:#fff4c2;
  --danger:#ff5d72;
  --glow-strength:1;
  --shadow:0 30px 70px -30px rgba(0,0,0,.8);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:16px;
  --rail:268px;
  --gut:clamp(16px,3.2vw,44px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3eef4; --bg-1:#ede5ef; --bg-2:#fbf8fc; --bg-3:#e9e0ec;
    --line:rgba(74,40,94,.13); --line-2:rgba(74,40,94,.25);
    --fg:#1f1631; --fg-2:#594c6d; --fg-3:#8a7e9d; --ink-inv:#fbf8fc; --scrim:rgba(40,20,55,.35);
    --r-thal:#16719f; --r-pfc:#bb2878; --r-hip:#a35f06; --r-net:#6a3ccf; --r-cb:#0c7f5c; --r-sleep:#334dc2; --r-stem:#bd4527; --r-temp:#8a7300; --r-sys:#5a6180;
    --spark:#4a1874; --danger:#c42343; --glow-strength:0; --shadow:0 30px 70px -34px rgba(60,20,80,.4);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3eef4; --bg-1:#ede5ef; --bg-2:#fbf8fc; --bg-3:#e9e0ec;
  --line:rgba(74,40,94,.13); --line-2:rgba(74,40,94,.25);
  --fg:#1f1631; --fg-2:#594c6d; --fg-3:#8a7e9d; --ink-inv:#fbf8fc; --scrim:rgba(40,20,55,.35);
  --r-thal:#16719f; --r-pfc:#bb2878; --r-hip:#a35f06; --r-net:#6a3ccf; --r-cb:#0c7f5c; --r-sleep:#334dc2; --r-stem:#bd4527; --r-temp:#8a7300; --r-sys:#5a6180;
  --spark:#4a1874; --danger:#c42343; --glow-strength:0; --shadow:0 30px 70px -34px rgba(60,20,80,.4);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#06080f; --bg-1:#0a0e1a; --bg-2:#0f1424; --bg-3:#171e35;
  --line:rgba(146,164,255,.13); --line-2:rgba(146,164,255,.26);
  --fg:#e8ebf7; --fg-2:#a6aecb; --fg-3:#6e7696; --ink-inv:#06080f; --scrim:rgba(2,3,9,.62);
  --r-thal:#52d6ff; --r-pfc:#ff5cbe; --r-hip:#ffb648; --r-net:#a585ff; --r-cb:#3fe0a5; --r-sleep:#7d93ff; --r-stem:#ff7c5c; --r-temp:#ffe066; --r-sys:#b4bdd9;
  --spark:#fff4c2; --danger:#ff5d72; --glow-strength:1; --shadow:0 30px 70px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(55vw 45vh at 92% -8%, color-mix(in srgb,var(--r-net) 11%,transparent), transparent 70%),
    radial-gradient(45vw 45vh at -8% 108%, color-mix(in srgb,var(--r-thal) 8%,transparent), transparent 70%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--r-thal);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font-family:var(--font-mono);font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--fg-3)}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:22px 14px 16px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg-1) 78%,transparent);backdrop-filter:blur(12px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 6px}
.brand-mark{width:40px;height:40px;flex:none;color:var(--r-pfc)}
.brand-mark .ax{stroke-dasharray:3 46;animation:axonRun 2.4s linear infinite}
@keyframes axonRun{to{stroke-dashoffset:-49}}
.brand-name{font-family:var(--font-display);font-weight:760;font-size:23px;line-height:1;letter-spacing:-.025em;font-stretch:86%}
.brand-sub{margin-top:5px;font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-3);padding:14px 10px 6px}
.nav-btn{--c:var(--fg-2);display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;border:0;background:transparent;color:var(--fg-2);text-align:left;cursor:pointer;transition:background .2s,color .2s}
.nav-btn:hover{background:color-mix(in srgb,var(--c) 9%,transparent);color:var(--fg)}
.nav-btn[aria-current="page"]{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--fg)}
.soma{position:relative;width:9px;height:9px;border-radius:50%;background:var(--c);justify-self:center;box-shadow:0 0 calc(12px * var(--glow-strength)) var(--c)}
.nav-btn[aria-current="page"] .soma::after,.tab[aria-current="page"] .soma::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--c);animation:somaPulse 2.2s ease-out infinite}
@keyframes somaPulse{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.9);opacity:0}}
.receive .soma{animation:receive .8s cubic-bezier(.2,.9,.3,1)}
@keyframes receive{0%{transform:scale(1)}25%{transform:scale(2.6);box-shadow:0 0 26px var(--c)}100%{transform:scale(1)}}
.nav-text{display:flex;flex-direction:column;min-width:0}
.nav-name{font-weight:700;font-size:14.5px;line-height:1.2}
.nav-region{font-family:var(--font-mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nav-count{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav-count.hot{color:var(--c)}
.rail-foot{margin-top:auto;display:grid;gap:10px;padding:0 4px}
.search-hint{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg-2);color:var(--fg-3);cursor:pointer;font-size:13.5px}
.search-hint kbd{margin-left:auto}
.search-hint:hover{color:var(--fg);border-color:var(--line-2)}
.sync{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10px;color:var(--fg-3);padding:4px 8px;letter-spacing:.02em}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none}
.sync[data-s="cloud"] i{background:var(--r-cb);box-shadow:0 0 calc(10px*var(--glow-strength)) var(--r-cb)}
.sync[data-s="local"] i{background:var(--r-hip)}
.sync[data-s="error"] i,.sync[data-s="full"] i{background:var(--danger)}

.main{min-width:0;padding-inline:var(--gut);padding-block:0 80px}
.capture{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:calc(-1 * var(--gut));padding:14px var(--gut) 10px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--line)}
.m-top{display:none}
.cap-form{position:relative;display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:17px;padding:6px 6px 6px 16px;transition:border-color .25s,box-shadow .25s}
.cap-form:focus-within{border-color:var(--r-thal);box-shadow:0 0 0 4px color-mix(in srgb,var(--r-thal) 17%,transparent),0 0 calc(40px*var(--glow-strength)) -10px var(--r-thal)}
.cap-form.fired{animation:capFire .6s ease-out}
@keyframes capFire{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--r-thal) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.cap-form.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cap-tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--r-thal);white-space:nowrap}
.cap-input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16.5px;padding:10px 4px;outline:none}
.cap-input::placeholder{color:var(--fg-3)}
.cap-kinds{display:flex;gap:2px;background:var(--bg-3);border-radius:12px;padding:3px}
.kind-btn{border:0;background:transparent;color:var(--fg-3);font-weight:700;font-size:12.5px;padding:8px 11px;border-radius:9px;cursor:pointer}
.kind-btn[aria-pressed="true"]{background:var(--bg-1);color:var(--fg);box-shadow:0 1px 0 var(--line-2)}
.cap-send{display:flex;align-items:center;gap:7px;border:0;border-radius:12px;background:var(--r-thal);color:var(--ink-inv);font-weight:700;font-size:13.5px;padding:10px 15px;cursor:pointer;transition:transform .15s,filter .2s}
.cap-send:hover{filter:brightness(1.1)}
.cap-send:active{transform:scale(.96)}
.cap-hint{display:contents}
.cap-preview{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:26px;padding:8px 2px 0;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3)}
.pv{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.pv i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--fg-3))}
.pv.dest{border-color:color-mix(in srgb,var(--c) 55%,transparent);color:var(--fg)}
.pv-ok{color:var(--r-cb)}

/* ---------- views ---------- */
.view{display:none;padding-top:30px}
.view.active{display:block;animation:viewIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.25;transform:translateY(10px);filter:blur(3px)}}
.vh{display:grid;gap:12px;margin-bottom:28px;max-width:880px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--fg-3))}
.eyebrow .soma{width:7px;height:7px;--c:currentColor}
.vh h1,.home-title{margin:0;font-family:var(--font-display);font-weight:760;font-size:clamp(36px,5.4vw,64px);line-height:.95;letter-spacing:-.04em;font-stretch:82%;text-wrap:balance}
.lede{margin:0;color:var(--fg-2);font-size:16px;max-width:64ch}

.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px 8px}
.panel-t{margin:0;font-family:var(--font-display);font-weight:700;font-size:17.5px;letter-spacing:-.015em;display:flex;align-items:center;gap:9px}
.panel-t .soma{width:7px;height:7px}
.meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.empty{padding:22px 18px 24px;color:var(--fg-3);font-size:14px;display:grid;gap:10px}
.flat{display:block;width:100%;height:28px;color:var(--c,var(--fg-3))}

.btn{--c:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-3);color:var(--fg);font-weight:700;font-size:14px;padding:10px 15px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--c) 14%,var(--bg-3));border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.btn:active{transform:scale(.97)}
.btn.primary{--c:inherit;background:var(--c,var(--fg));color:var(--ink-inv);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{--c:var(--danger);color:var(--danger)}
.btn.danger.primary{color:var(--ink-inv)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:34px;height:34px;flex:none;border-radius:10px;border:0;background:transparent;color:var(--fg-3);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s}
.icon-btn:hover{background:var(--bg-3);color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--fg-2);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--fg)) 16%,transparent);border-color:color-mix(in srgb,var(--c,var(--fg)) 55%,transparent);color:var(--fg)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--fg-3))}
.chip .n{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
.chip.dim{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--font-mono);font-size:10.5px;color:var(--r-net)}
.ex{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--r-hip);border:1px dashed color-mix(in srgb,var(--r-hip) 60%,transparent);border-radius:6px;padding:1px 5px}
.input{width:100%;background:var(--bg-1);border:1px solid var(--line-2);border-radius:11px;color:var(--fg);font:inherit;font-size:15px;padding:10px 12px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--c,var(--r-thal));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--r-thal)) 18%,transparent)}
textarea.input{resize:vertical;line-height:1.55}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.seg{display:inline-flex;gap:2px;background:var(--bg-3);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--fg-3);font-weight:700;font-size:13px;padding:8px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg-1);color:var(--fg);box-shadow:0 1px 0 var(--line-2)}
.stack{display:grid;gap:18px}
.row-flex{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

/* task rows */
.rows{list-style:none;margin:0;padding:0 0 4px}
.row{--c:var(--r-pfc);position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px 11px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.enter{animation:synIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes synIn{0%{opacity:0;transform:translateX(-14px);background:color-mix(in srgb,var(--c) 22%,transparent)}60%{opacity:1;background:color-mix(in srgb,var(--c) 10%,transparent)}100%{transform:none}}
.check{position:relative;width:22px;height:22px;border-radius:50%;border:1.7px solid color-mix(in srgb,var(--c) 75%,var(--fg-3));background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink-inv);transition:background .2s,transform .2s}
.check:hover{background:color-mix(in srgb,var(--c) 16%,transparent);transform:scale(1.08)}
.check svg{opacity:0;transition:opacity .2s}
.check[aria-checked="true"]{background:var(--c);border-color:var(--c)}
.check[aria-checked="true"] svg{opacity:1}
.row-main{min-width:0;cursor:pointer}
.row-title{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.row.done .row-title{color:var(--fg-3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--fg-3) 70%,transparent)}
.row-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:3px;font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
.due.late{color:var(--danger)}
.due.today{color:var(--c)}
.proj{display:inline-flex;align-items:center;gap:5px}
.proj i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.prio{color:var(--r-hip);font-size:9px;vertical-align:2px;margin-right:2px}
.row-actions{display:flex;gap:2px;opacity:.75;transition:opacity .2s}
.row:hover .row-actions{opacity:1}
.ap{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ap path{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 calc(6px*var(--glow-strength)) var(--c))}
.ap text{font-family:var(--font-mono);font-size:10px;fill:var(--c)}

/* ---------- home ---------- */
.home-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.home-head .lede{margin-top:12px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--r-hip) 55%,transparent);background:color-mix(in srgb,var(--r-hip) 7%,transparent);margin-bottom:18px;font-size:14px}
.banner p{margin:0;flex:1 1 280px;color:var(--fg-2)}
.banner b{color:var(--fg)}
.home-hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,1fr);gap:18px;align-items:start}
.brain-wrap{position:relative;aspect-ratio:1.4/1;min-height:300px;max-width:100%;border-radius:24px;border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(70% 60% at 46% 46%, color-mix(in srgb,var(--r-net) 9%,transparent), transparent 72%), var(--bg-1)}
.brain-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.brain-wrap.hovering canvas{cursor:pointer}
.brain-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--zx,50%) var(--zy,50%), var(--spark), transparent 55%);mix-blend-mode:screen}
.brain-wrap.zooming::after{animation:zflash .55s ease-in forwards}
@keyframes zflash{0%{opacity:0}100%{opacity:.85}}
.brain-wrap.zooming .blabels{opacity:0;transition:opacity .2s}
.blabels{position:absolute;inset:0;pointer-events:none}
.blabel{--c:var(--fg-2);pointer-events:auto;position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--fg);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),background .2s}
.blabel:hover,.blabel.hl{background:color-mix(in srgb,var(--c) 24%,var(--bg));transform:translate(-50%,-50%) scale(1.08)}
.blabel .soma{width:7px;height:7px}
.blabel .bl-count{font-family:var(--font-mono);font-size:10px;color:var(--c);font-variant-numeric:tabular-nums}
.blabel .bl-count:empty{display:none}
.brain-hud{position:absolute;left:16px;top:14px;display:grid;gap:3px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);pointer-events:none}
.brain-hud b{font-weight:500;color:var(--fg-2)}
.brain-hint{position:absolute;right:16px;bottom:12px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--fg-3);pointer-events:none;text-align:right}
.signals{display:grid;gap:10px;min-width:0}
.sig{--c:var(--fg-2);display:grid;grid-template-columns:minmax(2.2ch,auto) minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:13px 14px 13px 16px;border-radius:15px;background:var(--bg-2);border:1px solid var(--line);text-align:left;cursor:pointer;transition:border-color .2s,transform .2s,background .2s}
.sig:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateX(3px)}
.sig-num{font-family:var(--font-display);font-weight:760;font-size:30px;line-height:1;letter-spacing:-.04em;color:var(--c);font-variant-numeric:tabular-nums;font-stretch:85%}
.sig-label{font-weight:700;font-size:14px;line-height:1.25}
.sig-sub{display:block;font-size:12.5px;color:var(--fg-3);font-weight:400;margin-top:2px}
.sig-reg{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);writing-mode:vertical-rl;transform:rotate(180deg)}
.sig.alert{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--bg-2))}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px;margin-top:18px;align-items:start}
.mini-habit{--c:var(--r-cb);display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.mini-habit:first-child{border-top:0}
.recent{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.recent:first-child{border-top:0}
.recent:hover{background:var(--bg-3)}
.recent .soma{width:7px;height:7px}
.recent span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* ---------- thalamus ---------- */
.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.inbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.scard{--c:var(--r-thal);position:relative;display:grid;gap:12px;padding:16px 16px 14px 18px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--line);transition:transform .4s cubic-bezier(.5,0,.7,.4),opacity .35s,border-color .2s;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;border-radius:2px;background:linear-gradient(var(--c),transparent);opacity:.8}
.scard:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.scard.routing{transform:translateX(40px) scale(.94);opacity:0}
.scard-title{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere;cursor:pointer}
.scard-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scard-act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scard-act .grow{flex:1}

/* ---------- prefrontal ---------- */
.addline{display:flex;gap:8px;margin-bottom:18px}
.addline .input{flex:1}
.ppanel{--c:var(--r-pfc);display:grid;gap:14px;padding:16px 18px;margin-bottom:18px}
.pname{width:100%;border:0;background:transparent;color:var(--fg);font-family:var(--font-display);font-weight:720;font-size:26px;letter-spacing:-.025em;font-stretch:86%;outline:none;padding:0;border-bottom:1px dashed transparent}
.pname:focus{border-bottom-color:var(--line-2)}
.bar{height:6px;border-radius:6px;background:var(--bg-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c);box-shadow:0 0 calc(10px*var(--glow-strength)) var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg-2) inset}
.groups{display:grid;gap:16px}
.group-late{--c:var(--danger)}
details.panel summary{cursor:pointer;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary .meta::after{content:" +";}
details[open].panel summary .meta::after{content:" −"}

/* ---------- hippocampe ---------- */
.htools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.htools .input{flex:1 1 240px;max-width:420px}
.hip-tags{margin-bottom:18px}
.notes{columns:290px;column-gap:16px}
.note{--c:var(--r-hip);break-inside:avoid;display:block;width:100%;margin:0 0 16px;padding:16px 18px 14px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--line);text-align:left;cursor:pointer;position:relative;transition:border-color .25s,transform .25s;overflow:hidden}
.note:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-2px)}
.note::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);opacity:calc(.25 + .75*var(--w,0));pointer-events:none}
.note-t{margin:0 0 6px;font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere;font-stretch:90%}
.note-x{margin:0;color:var(--fg-2);font-size:14px;overflow-wrap:anywhere;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.note-f{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:12px}
.syn{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:10px;color:var(--c)}
.syn i{width:4px;height:4px;border-radius:50%;background:currentColor}

/* ---------- connectome ---------- */
.graph-wrap{position:relative;height:min(68vh,680px);min-height:400px;border-radius:24px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(60% 60% at 50% 50%, color-mix(in srgb,var(--r-net) 8%,transparent), transparent 75%), var(--bg-1)}
.graph-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.graph-hud{position:absolute;left:16px;top:14px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);pointer-events:none;display:grid;gap:3px}
.graph-hud b{color:var(--fg-2);font-weight:500}
.legend{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);font-family:var(--font-mono);font-size:9.5px;color:var(--fg-2)}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.legend i.dia{border-radius:1px;transform:rotate(45deg)}
.legend i.ring{background:transparent;border:1.5px solid var(--c)}
.graph-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--fg-3)}

/* ---------- cervelet ---------- */
.habits{display:grid;gap:14px}
.habit{--c:var(--r-cb);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;align-items:center;padding:16px 18px 14px}
.hname{width:100%;border:0;background:transparent;color:var(--fg);font-family:var(--font-display);font-weight:720;font-size:20px;letter-spacing:-.02em;outline:none;padding:0;border-bottom:1px dashed transparent;font-stretch:90%}
.hname:focus{border-bottom-color:var(--line-2)}
.hstats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
.hstats b{color:var(--c);font-weight:500}
.axon{grid-column:1/-1;display:block;width:100%;height:50px}
.hfoot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.week{display:flex;gap:5px;flex-wrap:wrap}
.day{width:34px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--fg-3);font-family:var(--font-mono);font-size:9px;display:grid;place-items:center;align-content:center;gap:2px;cursor:pointer;padding:0;line-height:1;transition:background .2s,border-color .2s}
.day b{font-size:11px;font-weight:500;color:var(--fg-2)}
.day[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c)}
.day[aria-pressed="true"] b{color:var(--fg)}
.day.today{border-style:dashed}
.fire[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,var(--bg-3));border-color:var(--c)}

/* ---------- sommeil ---------- */
.eeg{position:relative;height:150px;border-radius:20px;border:1px solid var(--line);background:var(--bg-1);overflow:hidden;margin-bottom:20px}
.eeg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.eeg-label{position:absolute;left:14px;top:10px;right:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--r-sleep);pointer-events:none}
.eeg-label span:last-child{color:var(--fg-3)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.stage{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-3)}
.stage.cur{color:var(--fg);border-color:var(--r-sleep);background:color-mix(in srgb,var(--r-sleep) 15%,transparent)}
.stage.done{color:var(--r-sleep)}
.rcard{--c:var(--r-sleep);display:grid;gap:16px;padding:22px clamp(16px,3vw,28px)}
.rcard h2{margin:0;font-family:var(--font-display);font-weight:740;font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;line-height:1.05;font-stretch:86%;text-wrap:balance}
.rcard p{margin:0;color:var(--fg-2);max-width:62ch}
.phases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.phases li{padding:12px 14px;border-radius:12px;background:var(--bg-1);border:1px solid var(--line);display:grid;gap:4px}
.phases b{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--r-sleep);font-weight:500}
.tri{display:grid;gap:14px;padding:20px;border-radius:16px;background:var(--bg-1);border:1px solid var(--line-2);animation:replay .5s cubic-bezier(.2,.8,.2,1)}
@keyframes replay{from{opacity:.2;transform:translateY(12px) scale(.98)}}
.tri-t{font-family:var(--font-display);font-weight:720;font-size:22px;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.big-num{font-family:var(--font-display);font-weight:780;font-size:56px;line-height:.9;letter-spacing:-.05em;color:var(--c);font-stretch:80%}

/* ---------- tronc ---------- */
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.sys .panel{display:grid;gap:12px;padding:18px}
.sys h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.015em}
.sys p{margin:0;color:var(--fg-2);font-size:14px}
.syntax{width:100%;border-collapse:collapse;font-size:13.5px}
.syntax td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.syntax td:first-child{font-family:var(--font-mono);font-size:11px;color:var(--r-thal);padding-right:12px;white-space:nowrap}
.export-box{font-family:var(--font-mono);font-size:11px;min-height:140px}

/* ---------- drawer, palette, toast ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{--c:var(--r-hip);position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(580px,100%);display:flex;flex-direction:column;background:var(--bg-1);border-left:1px solid var(--line-2);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .42s cubic-bezier(.2,.85,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(transparent,var(--c),transparent);opacity:.7}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px 20px;border-bottom:1px solid var(--line)}
.dr-scroll{flex:1;overflow-y:auto;padding:20px 22px 28px;display:grid;gap:18px;align-content:start}
.dr-title{width:100%;border:0;background:transparent;color:var(--fg);font-family:var(--font-display);font-weight:740;font-size:30px;letter-spacing:-.03em;line-height:1.08;resize:none;outline:none;padding:0;overflow:hidden;font-stretch:86%}
.dr-title::placeholder{color:var(--fg-3)}
.dr-body{min-height:230px}
.dr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.toggle{display:inline-flex;align-items:center;gap:9px;padding:9px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--bg-1);cursor:pointer;font-weight:700;font-size:13.5px;color:var(--fg-2)}
.toggle[aria-pressed="true"]{color:var(--fg);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--bg-1))}
.toggle i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.toggle[aria-pressed="true"] i{background:var(--c);border-color:var(--c)}
.links{display:grid;gap:8px}
.lchip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);font-weight:600;font-size:13px;cursor:pointer;max-width:100%}
.lchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lchip.missing{border-style:dashed;color:var(--fg-3)}
.lchip .soma{width:6px;height:6px}
.dr-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid var(--line)}
.saved{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
.saved.on{color:var(--r-cb)}

.palette{position:fixed;inset:0;z-index:70;display:grid;justify-items:center;align-content:start;padding:12vh 16px 16px;background:var(--scrim)}
.pal-box{width:min(640px,100%);background:var(--bg-1);border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:replay .3s cubic-bezier(.2,.8,.2,1)}
.pal-input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:18px;padding:18px 20px;outline:none}
.pal-list{max-height:52vh;overflow-y:auto;padding:6px}
.pal-item{--c:var(--fg-3);display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 14px;border-radius:11px;border:0;background:transparent;text-align:left;cursor:pointer}
.pal-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pal-item[aria-selected="true"]{background:var(--bg-3)}
.pal-item .soma{width:7px;height:7px}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:11px 12px 11px 16px;border-radius:13px;background:var(--fg);color:var(--ink-inv);font-weight:700;font-size:14px;box-shadow:var(--shadow);transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:1px solid currentColor;background:transparent;border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer;color:inherit}
.toast button:empty{display:none}


/* ---------- révisions ---------- */
html.locked,html.locked body{overflow:hidden}
.shead{--c:var(--r-temp);display:grid;gap:14px;padding:18px;margin-bottom:18px}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.chap{display:grid;gap:12px;align-content:start;padding:16px 18px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--line);transition:border-color .2s,transform .25s}
.chap:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent);transform:translateY(-2px)}
.chap-t{margin:0;font-family:var(--font-display);font-weight:720;font-size:20px;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere;cursor:pointer;font-stretch:88%}
.rich{display:grid;gap:5px;font-size:15.5px;line-height:1.55;overflow-wrap:anywhere;min-width:0}
.rich h4{margin:10px 0 2px;font-family:var(--font-display);font-weight:720;font-size:19px;letter-spacing:-.015em;color:var(--c,var(--fg))}
.rich h4:first-child{margin-top:0}
.rich .li{padding-left:16px;position:relative}
.rich .li::before{content:"";position:absolute;left:3px;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--c,var(--fg-3))}
.rich mark{background:color-mix(in srgb,var(--r-temp) 32%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.rich sup,.rich sub{font-size:.7em;line-height:0}
.rich .sp{height:4px}
.cards-list .crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px 18px;align-items:start;padding:12px 16px;border-top:1px solid var(--line)}
.cards-list .crow:first-child{border-top:0}
.crow .rich{font-size:14.5px}
.crow-side{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--bg-3);border:1px solid var(--line-2)}
.lvl i.on{background:var(--c);border-color:var(--c)}
@media (max-width:720px){.cards-list .crow{grid-template-columns:minmax(0,1fr)}.crow-side{justify-content:flex-start}}

/* overlays: study + calm */
.ov{position:fixed;inset:0;z-index:85;display:flex;flex-direction:column;overflow-y:auto;background:var(--bg)}
.study{--c:var(--r-temp);padding:calc(16px + env(safe-area-inset-top,0px)) var(--gut) calc(18px + env(safe-area-inset-bottom,0px));background:radial-gradient(70% 50% at 50% 42%, color-mix(in srgb,var(--c) 9%,transparent), transparent 70%), var(--bg)}
.study-in{width:min(780px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.ov-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ov-title{margin:6px 0 0;font-family:var(--font-display);font-weight:740;font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;line-height:1.05;font-stretch:86%;overflow-wrap:anywhere}
.fc-stage{flex:1;display:grid;place-items:center;perspective:1600px;min-height:280px;padding:6px 0}
.fc-anim{width:100%;display:grid;justify-items:center}
.fc-anim.in{animation:fcIn .45s cubic-bezier(.2,.8,.2,1)}
.fc-anim.out{animation:fcOut .24s ease-in forwards}
@keyframes fcIn{from{opacity:0;transform:translateY(22px) scale(.97)}}
@keyframes fcOut{to{opacity:0;transform:translateX(-70px) rotate(-4deg)}}
.fc{position:relative;width:100%;min-height:min(46vh,380px);display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.85,.25,1);outline-offset:6px;border-radius:26px}

.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade{--c:var(--fg-2);display:grid;gap:4px;justify-items:center;padding:12px 8px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line-2));background:var(--bg-2);cursor:pointer;font-weight:700;font-size:14.5px;transition:background .2s,transform .15s}
.grade:hover{background:color-mix(in srgb,var(--c) 15%,var(--bg-2))}
.grade:active{transform:scale(.97)}
.grade small{font-family:var(--font-mono);font-size:9.5px;font-weight:400;color:var(--fg-3)}

.ltp{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:520px}
.ltp i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 calc(12px*var(--glow-strength)) var(--c);animation:ltp .55s cubic-bezier(.2,.9,.3,1.5) backwards}

.sheet-read{padding:24px clamp(18px,4vw,36px)}

/* ---------- pause ---------- */
.pause-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.pause-grid{grid-template-columns:minmax(0,1fr)}}
.pset{display:grid;gap:22px;padding:20px}
.breaths{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.breath{--c:var(--r-stem);display:grid;gap:4px;padding:13px 14px;border-radius:13px;border:1px solid var(--line-2);background:var(--bg-1);text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.breath b{font-size:14.5px}

.breath[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--bg-1))}
.btn.big{padding:14px 22px;font-size:16px;border-radius:14px}
.preset{display:inline-flex;align-items:center}

.week-bars i{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--c)}
.calm{z-index:88;background:#04070f;color:#eaf1ff;overflow:hidden}
.calm canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.calm-ui{position:relative;z-index:1;flex:1;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.calm-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.calm-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:rgba(234,241,255,.6);text-transform:uppercase;text-align:left}

.calm-count{font-family:var(--font-mono);font-size:14px;color:rgba(234,241,255,.72);min-height:1.4em}
.calm-bot{display:grid;gap:16px;justify-items:center}

.calm-ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90;display:none}

.scrim{visibility:hidden;transition:opacity .3s,visibility 0s .3s}

  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg-1) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

  .main{padding-bottom:120px}

  .view{padding-top:22px}
}

  .brain-wrap{aspect-ratio:1.05/1;min-height:0}
  .blabel{font-size:11px;padding:4px 8px 4px 7px;gap:5px}
  .brain-hint{display:none}
  .row{padding-inline:12px}
  .row-actions{opacity:1}
  .dr-scroll{padding-inline:18px}
}

<div class="app">

<script>
(() => {
'use strict';

/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const norm = s => String(s || '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
const TAU = Math.PI * 2;
const reduceQ = matchMedia('(prefers-reduced-motion: reduce)');

const ICON = {
  check: '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  trash: '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  later: '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  close: '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  search: '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
  spike: '<svg viewBox="0 0 24 16" width="20" height="14" aria-hidden="true"><path d="M1 11h7l2-1 2.2-8.5L14.5 14l2-3H23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  edit: '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 16l1-4 8-8 3 3-8 8-4 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  book: '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3.5 4.5c2.5-1 4.5-1 6.5.5 2-1.5 4-1.5 6.5-.5v11c-2.5-1-4.5-1-6.5.5-2-1.5-4-1.5-6.5-.5zM10 5v11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  arrow: '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
$$('.ico-search').forEach(e => e.innerHTML = ICON.search);
$$('.ico-spike').forEach(e => e.innerHTML = ICON.spike);
$$('.ico-close').forEach(e => e.innerHTML = ICON.close);

/* ================= dates ================= */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => isoOf(new Date());
const addDays = (iso, n) => { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const diffDays = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 864e5);
const DOW = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MON = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MONF = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function fmtDue(iso) {
  const d = diffDays(today(), iso);
  if (d === 0) return 'Aujourd’hui';
  if (d === 1) return 'Demain';
  if (d === -1) return 'Hier';
  if (d < 0) return `En retard · ${-d} j`;
  const dt = parseIso(iso);
  if (d < 7) return capFirst(DOW[dt.getDay()]);
  return `${dt.getDate()} ${MON[dt.getMonth()]}`;
}
const fmtShort = iso => { const dt = parseIso(iso); return `${dt.getDate()} ${MON[dt.getMonth()]}`; };
function fmtAgo(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'à l’instant';
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  const d = Math.floor(s / 86400);

const DATE_RULES = [
  [/(^|\s)(après-demain|apres-demain)(?=\s|$)/i, () => addDays(today(), 2)],
  [/(^|\s)(aujourd['’]hui|auj|ce soir|ce matin)(?=\s|$)/i, () => today()],

  [/(^|\s)dans\s+(\d{1,3})\s*(j|jours?)(?=\s|$)/i, m => addDays(today(), +m[2])],
  [/(^|\s)dans\s+(\d{1,2})\s*(sem\.?|semaines?)(?=\s|$)/i, m => addDays(today(), 7 * m[2])],
  [/(^|\s)(?:la\s+)?semaine\s+prochaine(?=\s|$)/i, () => nextDow('lundi')],
  [/(^|\s)(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(\s+prochain)?(?=\s|$)/i, m => nextDow(m[2])],

  }
  if (pfState.project !== 'all' && !projById(pfState.project)) pfState.project = 'all';
  const t = today();
  const tasksAll = S.items.filter(i => i.kind === 'task');
  const projs = S.projects.slice().sort((a, b) => a.done - b.done);
  const pc = id => { const ts = tasksAll.filter(i => i.project === id); return [ts.filter(i => i.done).length, ts.length]; };
  $('#pfc-projects').innerHTML = `<button type="button" class="chip" data-act="pfilter" data-p="all" aria-pressed="${pfState.project === 'all'}">Toutes <span class="n">${tasksAll.filter(i => !i.done).length}</span></button>` +
    projs.map(p => { const [d, n] = pc(p.id); return `<button type="button" class="chip${p.done ? ' dim' : ''}" data-act="pfilter" data-p="${p.id}" aria-pressed="${pfState.project === p.id}" style="--c:var(--r-${p.color})"><span class="dot"></span>${esc(p.name)} <span class="n">${d}/${n}</span></button>`; }).join('') +
    (pfState.adding ? `<form id="proj-new" class="row-flex"><label class="sr" for="proj-name">Nom du projet</label><input class="input" id="proj-name" placeholder="Nom du projet" style="width:220px;padding:6px 12px;--c:var(--r-pfc)" autocomplete="off"><button class="btn small primary" style="--c:var(--r-pfc)" type="submit">Créer</button><button class="btn small ghost" type="button" data-act="proj-cancel">Annuler</button></form>` : `<button type="button" class="chip" data-act="proj-add">${ICON.plus} Projet</button>`);
  const pf = $('#proj-new'); if (pf) { const inp = $('#proj-name'); inp.focus(); pf.addEventListener('submit', e => { e.preventDefault(); const n = inp.value.trim(); if (!n) return; const p = { id: uid(), name: n, color: PCOLORS[S.projects.length % PCOLORS.length], done: false, created: Date.now(), ex: false }; S.projects.push(p); pfState.adding = false; pfState.project = p.id; commit(); }); }
  const P = pfState.project !== 'all' ? projById(pfState.project) : null;
  if (P) {
    const [d, n] = pc(P.id); const pct = n ? Math.round(d / n * 100) : 0;
    const nextOpen = tasksAll.filter(i => i.project === P.id && !i.done).sort(sortTasks)[0];
    $('#pfc-panel').innerHTML = `<section class="panel ppanel" style="--c:var(--r-${P.color})">
      <div class="row-flex" style="justify-content:space-between"><div class="eyebrow"><span class="soma"></span>Projet${P.done ? ' · terminé' : ''}</div><span class="meta">${d}/${n} actions faites · ${pct} %</span></div>
      <label class="sr" for="proj-rename">Nom du projet</label><input class="pname" id="proj-rename" value="${esc(P.name)}" data-pid="${P.id}">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p class="meta" style="margin:0">${nextOpen ? 'Prochaine étape : ' + esc(nextOpen.title) : 'Aucune action ouverte. Ajoute la prochaine étape ci-dessus.'}</p>
      <div class="row-flex" style="justify-content:space-between"><div class="swatches" role="group" aria-label="Couleur">${PCOLORS.map(c => `<button type="button" class="sw" style="--c:var(--r-${c})" data-act="proj-color" data-c="${c}" aria-pressed="${P.color === c}" aria-label="Couleur ${c}"></button>`).join('')}</div>
      <div class="row-flex"><button type="button" class="btn small" data-act="proj-done">${P.done ? 'Réactiver' : 'Marquer terminé'}</button><button type="button" class="btn small danger${pfState.confirmDel ? ' primary' : ''}" data-act="proj-del">${pfState.confirmDel ? 'Confirmer la suppression' : 'Supprimer'}</button></div></div>
    </section>`;
    const rn = $('#proj-rename'); rn.addEventListener('change', () => { const v = rn.value.trim(); if (v) { P.name = v; P.ex = false; commit(); } });
  } else $('#pfc-panel').innerHTML = '';
  const tasks = tasksAll.filter(i => P ? i.project === P.id : true);
  const open = tasks.filter(i => !i.done).sort(sortTasks);
  const t1 = addDays(t, 1), t7 = addDays(t, 7);
  const groups = [
    ['En retard', i => i.due && i.due < t, 'var(--danger)'],
    ['Aujourd’hui', i => i.due === t],
    ['Demain', i => i.due === t1],
    ['7 prochains jours', i => i.due > t1 && i.due <= t7],
    ['Plus tard', i => i.due > t7],
    ['Sans échéance', i => !i.due]
  ];
  let h = '';
  for (const [label, fn, col] of groups) {
    const g = open.filter(fn); if (!g.length) continue;
    h += `<section class="panel"${col ? ` style="--c:${col}"` : ''}><div class="panel-h"><h2 class="panel-t">${col ? '<span class="soma" style="--c:var(--danger)"></span>' : ''}${esc(label)}</h2><span class="meta">${g.length}</span></div><ul class="rows">${g.map(taskRow).join('')}</ul></section>`;
  }
  if (!open.length) h += `<div class="panel empty">${FLAT}<b style="color:var(--fg)">Aucune action ouverte${P ? ' dans ce projet' : ''}.</b>Ajoute-en une ci-dessus, ou capture-la en haut avec une date.</div>`;
  const done = tasks.filter(i => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  if (done.length) h += `<details class="panel"><summary class="panel-h"><h2 class="panel-t" style="color:var(--fg-2)">Faites</h2><span class="meta">${done.length}</span></summary><ul class="rows">${done.slice(0, 30).map(taskRow).join('')}</ul></details>`;
  $('#pfc-groups').innerHTML = h;
}

function renderHipList() {

  if (hipState.tag && !tc.has(hipState.tag)) hipState.tag = null;

      <div class="note-f"><span class="syn">${'<i></i>'.repeat(Math.min(syn, 6))}${syn} synapse${syn > 1 ? 's' : ''}</span>${P ? `<span class="meta proj" style="--c:var(--r-${P.color})"><i></i>${esc(P.name)}</span>` : ''}${tagsOf(n).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}${n.ex ? '<span class="ex">exemple</span>' : ''}<span class="meta">${esc(fmtAgo(n.updated))}</span></div>
    </button>`; }).join('')}</div>` : `<div class="panel empty" style="--c:var(--r-hip)">${FLAT}<b style="color:var(--fg)">${q || hipState.tag ? 'Aucun souvenir ne correspond.' : 'Aucun souvenir encodé.'}</b>${q || hipState.tag ? 'Essaie un autre mot ou un autre tag.' : 'Crée une note, ou capture une idée avec « note: » devant.'}</div>`;

/* ---------- sleep / weekly review ---------- */
const rv = { step: 0, dump: '', queue: [], idx: 0, intentions: ['', '', ''], routed: 0, replanned: 0, deleted: 0 };
const STAGES = [['Éveil', 'beta'], ['N1 · vider', 'theta'], ['N2 · trier', 'spindle'], ['N3 · consolider', 'delta'], ['REM · projeter', 'rem'], ['Réveil', 'ripple']];
function renderSleep() {
  const el = $('#sleep-body'); const t = today(); const st = stats();
  if (eeg) eeg.setMode(STAGES[rv.step][1]);
  let h = `<div class="stages" aria-label="Stades">${STAGES.map((s, i) => `<span class="stage${i === rv.step ? ' cur' : i < rv.step ? ' done' : ''}">${esc(s[0])}</span>`).join('')}</div>`;
  if (rv.step === 0) {
    h += `<section class="panel rcard"><div class="eyebrow"><span class="soma"></span>${st.since == null ? 'Aucune revue pour l’instant' : 'Dernière consolidation il y a ' + st.since + ' jour' + (st.since > 1 ? 's' : '')}</div>
      <h2>${st.since == null || st.since >= 7 ? 'Il est temps de consolider.' : 'Ton cerveau est à jour.'}</h2>
      <p>Pendant la nuit, l’hippocampe rejoue la journée et transfère ce qui compte vers le cortex. La revue fait pareil en quatre phases, comme un cycle de sommeil. Compte environ 15 minutes.</p>
      <ol class="phases"><li><b>N1 · vider</b>Tout ce qui traîne dans ta tête part au thalamus.</li><li><b>N2 · trier</b>Chaque signal devient une action, une mémoire, ou disparaît.</li><li><b>N3 · consolider</b>Les échéances dépassées sont replanifiées, chaque projet a sa prochaine étape.</li><li><b>REM · projeter</b>Tu choisis ce qui compte vraiment cette semaine.</li></ol>
      <div class="row-flex"><button type="button" class="btn primary" data-act="rv-start">Lancer la consolidation</button><span class="meta">${st.inbox} signaux à trier · ${st.overdue} échéances dépassées</span></div></section>`;
  } else if (rv.step === 1) {
    h += `<section class="panel rcard"><div class="eyebrow"><span class="soma"></span>Stade N1 · endormissement</div><h2>Vide ta tête.</h2>
      <p>Écris tout ce qui traîne : messages à envoyer, choses promises, idées, inquiétudes. Une ligne par signal. Pas de tri, c’est l’étape suivante.</p>
      <label class="sr" for="rv-dump">Tout ce qui te passe par la tête</label><textarea class="input" id="rv-dump" rows="7" placeholder="Rappeler la banque&#10;Idée de cadeau pour maman&#10;Rendre le livre à la bibliothèque" style="--c:var(--r-sleep)">${esc(rv.dump)}</textarea>
      <div class="row-flex"><button type="button" class="btn primary" data-act="rv-dump">Transmettre au thalamus</button><button type="button" class="btn ghost" data-act="rv-skip1">Rien à ajouter</button></div></section>`;
  } else if (rv.step === 2) {
    const queue = rv.queue.filter(id => { const i = itemById(id); return i && i.kind === 'inbox'; });
    const it = queue.length ? itemById(queue[0]) : null;
    if (!it) {
      h += `<section class="panel rcard"><div class="eyebrow"><span class="soma"></span>Stade N2 · tri</div><div class="big-num">0</div><h2>Thalamus vide.</h2><p>${rv.routed} signal${rv.routed > 1 ? 'x' : ''} routé${rv.routed > 1 ? 's' : ''}, ${rv.deleted} supprimé${rv.deleted > 1 ? 's' : ''}. Place au sommeil profond.</p><div class="row-flex"><button type="button" class="btn primary" data-act="rv-next">Continuer</button></div></section>`;
    } else {
      const total = rv.queue.length, done = total - queue.length;
      h += `<section class="panel rcard"><div class="row-flex" style="justify-content:space-between"><div class="eyebrow"><span class="soma"></span>Stade N2 · tri</div><span class="meta">${done + 1} / ${total}</span></div>
        <div class="bar"><i style="width:${Math.round(done / total * 100)}%"></i></div>
        <div class="tri" data-id="${it.id}" style="--c:var(--r-thal)"><span class="meta">reçu ${esc(fmtAgo(it.created))}</span><div class="tri-t">${esc(it.title || 'Sans titre')}</div>
          <div class="row-flex"><span class="meta" style="min-width:80px">Action pour</span>
            <button type="button" class="btn small" style="--c:var(--r-pfc)" data-act="tri-task" data-d="0">Aujourd’hui</button>
            <button type="button" class="btn small" style="--c:var(--r-pfc)" data-act="tri-task" data-d="1">Demain</button>
            <button type="button" class="btn small" style="--c:var(--r-pfc)" data-act="tri-task" data-d="7">Dans une semaine</button>
            <button type="button" class="btn small" style="--c:var(--r-pfc)" data-act="tri-task" data-d="">Sans date</button></div>
          <div class="row-flex"><span class="meta" style="min-width:80px">Ou bien</span>
            <button type="button" class="btn small" style="--c:var(--r-hip)" data-act="tri-note">Mémoire</button>
            <button type="button" class="btn small danger" data-act="tri-del">Supprimer</button>
            <button type="button" class="btn small ghost" data-act="tri-skip">Garder au thalamus</button>
            <button type="button" class="btn small ghost" data-act="open">Éditer</button></div>
        </div></section>`;
    }
  } else if (rv.step === 3) {
    const overdue = S.items.filter(i => i.kind === 'task' && !i.done && i.due && i.due < t).sort(sortTasks);
    const orphan = S.projects.filter(p => !p.done && !S.items.some(i => i.kind === 'task' && !i.done && i.project === p.id));
    h += `<section class="panel rcard"><div class="eyebrow"><span class="soma"></span>Stade N3 · sommeil profond</div><h2>${overdue.length ? 'Replanifie ce qui a glissé.' : 'Aucune échéance dépassée.'}</h2>
      ${overdue.length ? `<ul class="rows" style="margin:0 -6px">${overdue.map(i => `<li class="row" data-id="${i.id}" style="grid-template-columns:minmax(0,1fr)"><div class="row-main" data-act="open"><div class="row-title">${esc(i.title)}</div><div class="row-sub"><span class="due late">${esc(fmtDue(i.due))}</span></div></div><div class="row-flex"><button type="button" class="btn small" data-act="rp-done" style="--c:var(--r-cb)">Fait</button><button type="button" class="btn small" data-act="rp-move" data-d="1">Demain</button><button type="button" class="btn small" data-act="rp-move" data-d="7">Dans une semaine</button><button type="button" class="btn small" data-act="rp-move" data-d="">Sans date</button><button type="button" class="icon-btn" data-act="rp-del" aria-label="Supprimer">${ICON.trash}</button></div></li>`).join('')}</ul>` : '<p>Rien n’a glissé. Bien joué.</p>'}
      ${orphan.length ? `<h2 style="font-size:20px;margin-top:6px">Ces projets n’ont pas de prochaine étape.</h2>${orphan.map(p => `<form class="addline" data-orphan="${p.id}" style="margin:0"><label class="sr" for="or-${p.id}">Prochaine action pour ${esc(p.name)}</label><input class="input" id="or-${p.id}" placeholder="Prochaine action pour « ${esc(p.name)} »" style="--c:var(--r-${p.color})" autocomplete="off"><button class="btn small" style="--c:var(--r-${p.color})" type="submit">Ajouter</button></form>`).join('')}` : ''}
      <div class="row-flex"><button type="button" class="btn primary" data-act="rv-next">Continuer</button></div></section>`;
  } else if (rv.step === 4) {
    h += `<section class="panel rcard"><div class="eyebrow"><span class="soma"></span>Sommeil paradoxal · REM</div><h2>Qu’est-ce qui compte vraiment cette semaine ?</h2>
      <p>Trois intentions au maximum. Elles seront encodées dans une note de revue, reliée à ton hippocampe.</p>
      ${[0, 1, 2].map(i => `<label class="field"><span>Intention ${i + 1}</span><input class="input" data-intent="${i}" value="${esc(rv.intentions[i])}" placeholder="${['Finir le dossier X', 'Appeler Y', 'Dormir avant minuit'][i]}" style="--c:var(--r-sleep)" autocomplete="off"></label>`).join('')}
      <div class="row-flex"><button type="button" class="btn primary" data-act="rv-finish">Terminer la consolidation</button></div></section>`;
  } else {
    h += `<section class="panel rcard"><div class="eyebrow"><span class="soma"></span>Réveil · consolidation terminée</div>
      <div class="row-flex" style="gap:28px"><div><div class="big-num">${rv.routed}</div><span class="meta">signaux routés</span></div><div><div class="big-num">${rv.replanned}</div><span class="meta">échéances replanifiées</span></div><div><div class="big-num">${rv.deleted}</div><span class="meta">signaux effacés</span></div></div>
      <h2>Ton cerveau est consolidé.</h2><p>Prochaine revue conseillée : ${esc(capFirst(DOW[parseIso(addDays(t, 7)).getDay()]))} ${esc(fmtShort(addDays(t, 7)))}. Les ondulations hippocampiques ci-dessus sont celles qui accompagnent le transfert des souvenirs pendant le sommeil.</p>
      <div class="row-flex"><button type="button" class="btn primary" data-nav="cerveau">Retour au cerveau</button><button type="button" class="btn ghost" data-act="rv-reset">Recommencer</button></div></section>`;
  }
  el.innerHTML = h;
  const dump = $('#rv-dump'); if (dump) dump.addEventListener('input', () => rv.dump = dump.value);
  $$('[data-intent]', el).forEach(inp => inp.addEventListener('input', () => rv.intentions[+inp.dataset.intent] = inp.value));
  $$('form[data-orphan]', el).forEach(f => f.addEventListener('submit', e => {
    e.preventDefault(); const inp = f.querySelector('input'); const p = parseCapture(inp.value); if (!p.title) return;
    addItem(newItem('task', p.title, { due: p.due, prio: p.prio, project: f.dataset.orphan }));
    const c = center(f); FX.burst(c.x, c.y, RC('prefrontal'), 16);
  }));
}
function rvGo(step) { rv.step = step; renderSleep(); window.scrollTo({ top: 0, behavior: calm() ? 'auto' : 'smooth' }); }

/* ---------- system ---------- */

  'dr-goto': (id, el) => { drawerId = el.dataset.to; renderDrawer(); $('#dr-title').focus(); },
  'dr-create': (id, el) => { const it = newItem('note', el.dataset.t); addItem(it, { silent: true }); drawerId = it.id; renderDrawer(); scheduleSoftRender(); $('#dr-body').focus(); },
  'dr-tag': (id, el) => { hipState.tag = el.dataset.t; closeDrawer(); go('hippocampe'); }
};
document.addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { const reg = z.dataset.zoom; if (brain) brain.zoomInto(reg, () => go(reg)); else go(reg); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { if (drawerId) closeDrawer(); go(nav.dataset.nav); return; }
  const pi = e.target.closest('[data-pi]');
  if (pi) { pickPalette(+pi.dataset.pi); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const host = a.closest('[data-id]');
  const fn = ACT[a.dataset.act];
  if (fn) { e.preventDefault(); fn(host ? host.dataset.id : null, a, e); }
});
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('touchend', e => {
  const t = e.target && e.target.closest && e.target.closest('textarea, input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=file]):not([type=range])');
  if (t && !t.disabled && !t.readOnly && document.activeElement !== t) t.focus();
}, { passive: true });
$('#palette').addEventListener('click', e => { if (e.target.id === 'palette') closePalette(); });
$('#pal-input').addEventListener('input', () => { palSel = 0; renderPalette(); });
$('#pal-input').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); renderPalette(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); renderPalette(); }
  else if (e.key === 'Enter') { e.preventDefault(); pickPalette(palSel); }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName) || (document.activeElement && document.activeElement.isContentEditable);
  if (!$('#calm').hidden) { if (e.key === 'Escape') { e.preventDefault(); closePause(); } else if (e.key === ' ' && !calmS.done) { e.preventDefault(); togglePause(); } return; }
  if (!$('#study').hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeStudy(); return; }
    if (typing) return;
    if ((e.key === ' ' || (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'fc')) && study.phase === 'cards' && !study.flipped) { e.preventDefault(); flipCard(); return; }
    if (study.phase === 'cards' && study.flipped && /^[1-4]$/.test(e.key)) { e.preventDefault(); const g = ['again', 'hard', 'good', 'easy'][+e.key - 1]; gradeCard(g, $(`.grade[data-g="${g}"]`)); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#palette').hidden ? openPalette() : closePalette(); return; }
  if (e.key === 'Escape') { if (!$('#palette').hidden) closePalette(); else if (drawerId) closeDrawer(); else if (document.activeElement === $('#cap-input')) $('#cap-input').blur(); return; }
  if (e.key === '/' && !typing && !drawerId) { e.preventDefault(); $('#cap-input').focus(); }
});
$('#cap-form').addEventListener('submit', e => { e.preventDefault(); submitCapture(); });
$('#cap-input').addEventListener('input', () => { clearTimeout(submitCapture.t); renderPreview(); });
$$('.kind-btn').forEach(b => b.addEventListener('click', () => { capKind = b.dataset.kind; $$('.kind-btn').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderPreview(); }));
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== current && regById(h)) go(h); });
reduceQ.addEventListener('change', activateAnims);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshColors);
new MutationObserver(() => refreshColors()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
setInterval(() => { if (!drawerId && (current === 'cerveau' || current === 'prefrontal') && document.visibilityState === 'visible') renderView(); }, 60000);

/* ================= boot ================= */
S = loadLocal();
if (!S) { S = seed(); saveLocalNow(); }
applyPrefs();
buildChrome();
brain = new Brain($('#brain-wrap'));
graph = new Graph($('#graph-wrap'));
eeg = new EEG($('#eeg'));
renderPreview();
const h0 = location.hash.slice(1);
go(regById(h0) ? h0 : 'cerveau');
initCloud();
if (window.ENCEPHALE_PWA && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
